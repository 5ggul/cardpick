name: Move operator posts to notice board (one-shot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/move_operator_posts_to_notice.py'
      - '.github/workflows/move-operator-posts.yml'

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install psycopg2
        run: pip install --quiet psycopg2-binary
      - name: Verify secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD 미설정"
            exit 1
          fi
      - name: Move posts
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/move_operator_posts_to_notice.py
