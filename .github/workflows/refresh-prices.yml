name: Pokemon daily refresh + hot cards

# NANO tier IO 최적화 모드 (2026-06-01~):
# - 매일 cron이 IO budget(30분/일) 소진해 baseline 운영으로 전락
# - 변경: batch 감소 + 시간 분산 (1.5시간 집중 → 4.5시간 분산) + hot/cardmarket 빈도 감소
#
# 일일 INSERT 부하 비교:
#  이전: 1000 (TCG) + 168×500(CM 격일=84) + 800 (cold) + MV refresh 매일 = IO 폭발
#  변경: 600  (TCG) + CM 주2회                + 400 (cold) + MV refresh 격일 = IO 절반
#
# 2026-08-04 prices 인덱스 3종 추가 후 IO 대기 급감 (count 쿼리 timeout -> 1.4s,
# cold-rotation 13분42초). 여유분만큼 단계적 복원: TCG 600->800, cold 400->550.
# 원래값(1000/800)까지 한 번에 올리지 않는다. 2주 관찰 후 재검토.
#
# 트레이드오프: Trust 회복 살짝 느려짐, Cardmarket fresh 평균 1~3일 lag
on:
  schedule:
    - cron: '0 20 * * *'      # 05:00 KST TCGplayer 가격 (target 800장)
    - cron: '0 22 * * 1,5'    # 07:00 KST Cardmarket 평균 (주 2회: 월·금만)
    - cron: '40 20 */2 * *'   # 05:40 KST 핫카드 계산 (격일, 홀수일)
    - cron: '0 23 * * *'      # 08:00 KST Cold rotation (target 550장, 1시간 분산)
    - cron: '0 0 * * *'       # 09:00 KST Naver datalab trends
    - cron: '30 20 * * *'     # 05:30 KST 발매 캘린더 정적 HTML 재생성 + 커밋
  workflow_dispatch:
    inputs:
      job:
        description: 'pokemon | cardmarket | hot | cold | trends | calendar | all'
        required: false
        default: 'all'

jobs:
  pokemon-prices:
    if: github.event.schedule == '0 20 * * *' || github.event.inputs.job == 'pokemon' || github.event.inputs.job == 'all' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.POKEMON_TCG_API_KEY }}" ]; then
            echo "::error::POKEMON_TCG_API_KEY secret 미설정 — GitHub repo Settings → Secrets and variables → Actions 에서 등록"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret 미설정"
            exit 1
          fi
      - name: Pokemon TCG API refresh
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
          # (참고) refresh_pokemon_tcg_api.py 는 이 값을 읽지 않는다. 실제 처리량은
          # 스크립트 내부 deadline(분)이 결정한다. 혼동 방지용으로만 남김.
          POKEMON_DAILY_TARGET: '600'
          POKEMON_DEADLINE_MIN: '35'
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/refresh_pokemon_tcg_api.py

  cardmarket-refresh:
    if: github.event.schedule == '0 22 * * 1,5' || github.event.inputs.job == 'cardmarket' || github.event.inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.POKEMON_TCG_API_KEY }}" ] || [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::POKEMON_TCG_API_KEY 또는 SUPABASE_DB_PASSWORD 미설정"
            exit 1
          fi
      - name: Cardmarket avg7/14/30 refresh (172 sets, normalized name match)
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/refresh_cardmarket.py

  hot-cards:
    # 독립 실행 — needs 제거 (각 cron schedule에서 단독 트리거)
    # 격일 실행 (홀수일) — Cardmarket이 주 2회로 줄어 hot 매일 갱신 의미 작음
    if: github.event.schedule == '40 20 */2 * *' || github.event.inputs.job == 'hot' || github.event.inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD 미설정"
            exit 1
          fi
      - name: Compute hot cards
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/compute_hot_cards.py

  board-fix:
    # 수동 트리거 — 게시판 특정 댓글 삭제 (board_delete_comment.py)
    if: github.event.inputs.job == 'board-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Delete board comment
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/board_delete_comment.py

  seed-board:
    # 수동 트리거 — 게시판 시드 글/댓글 INSERT
    if: github.event.inputs.job == 'seed-board'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Seed board QnA post + comments (batch 1)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_qna.py
      - name: Seed board batch 2 (6 posts + comments)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch2.py
      - name: Seed board batch 3 (2 recent posts for home widget)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch3.py
      - name: Seed board batch 4 (직구 관세 / 입문 첫 박스)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch4.py
      - name: Seed board batch 5 (PSA 센터링 질문 / 최신 팩 개봉 후기)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch5.py
      - name: Seed board batch 6 (모서리 그레이딩 / 카드샵 빈티지 / 한글판·일판 수집)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch6.py
      - name: Seed board batch 7 (이중 슬리빙 / 첫 그레이딩 후기)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch7.py
      - name: Seed board batch 8 (박스 vs 싱글 입문 / 시세 급등 체감)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch8.py
      - name: Seed board batch 9 (장기 보관 색바램 / 첫 중고 거래 후기)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch9.py
      - name: Seed board batch 10 (예상등급 가늠 / 가품 의심 썰)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch10.py
      - name: Seed board batch 11 (장마철 습기 / 진열장 / 취미 지출)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch11.py
      - name: Seed board batch 12 (중복 정리 / 옛날 카드 / 영입 자랑 / 프로모)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/seed_board_batch12.py

  name-ko:
    # 수동 트리거 — cards.name_ko 채우기 (검증된 종족명 사전 기반, 추가 컬럼 UPDATE)
    if: github.event.inputs.job == 'name-ko'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Populate cards.name_ko (verified species dict)
        env:
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/populate_name_ko.py --write

  cold-rotation:
    # 매일 08:00 KST — 신규 카드 발견 + 가격 없거나 14일+ stale 카드 LRU 갱신
    # target 550장 (원래 800, 2026-08-05 인덱스 효과로 400->550 부분 복원)
    if: github.event.schedule == '0 23 * * *' || github.event.inputs.job == 'cold' || github.event.inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.POKEMON_TCG_API_KEY }}" ] || [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::POKEMON_TCG_API_KEY 또는 SUPABASE_DB_PASSWORD 미설정"
            exit 1
          fi
      - name: Discover new cards + cold rotation refresh
        env:
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
          COLD_DAILY_TARGET: '550'
          COLD_STALE_DAYS: '14'
          RUN_PHASE_A: '0'
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/refresh_cold_pokemon.py

  trends-naver:
    # 매일 09:00 KST — 네이버 데이터랩 검색어 트렌드 (30 키워드)
    if: github.event.schedule == '0 0 * * *' || github.event.inputs.job == 'trends' || github.event.inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psycopg2-binary
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.NAVER_CLIENT_ID }}" ] || [ -z "${{ secrets.NAVER_CLIENT_SECRET }}" ]; then
            echo "::error::NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 미설정"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD 미설정"
            exit 1
          fi
      - name: Fetch Naver Datalab trends
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SUPABASE_DB_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_DB_USER: postgres.aqxrmdratnkffvivguqs
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/fetch_naver_trends.py

  build-calendar:
    if: github.event.schedule == '30 20 * * *' || github.event.inputs.job == 'calendar' || github.event.inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build release calendar (static HTML regen from API + curated JSON)
        run: python scripts/build_release_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "cardpick-bot"
          git config user.email "admin@cardpick.kr"
          if git diff --quiet releases.html; then
            echo "발매 캘린더 변경 없음 — 커밋 생략"
          else
            git add releases.html
            # [skip ci] 제거 (2026-07-19): skip ci가 Cloudflare Pages 빌드까지 건너뛰어
            # 캘린더 커밋이 라이브에 반영 안 되던 문제. 갱신 스탬프가 매일 바뀌므로 매일 배포 필요.
            git commit -m "chore: 발매 캘린더 자동 갱신 (cron)"
            # ★ 2026-07-30: pull --rebase 추가 — 원격이 앞서 있으면 push가 조용히 실패해
            #   캘린더가 며칠간 라이브 미반영되던 문제(7/28~29). 재시도까지 포함.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
            echo "발매 캘린더 갱신 커밋 완료"
            echo "calendar_changed=1" >> $GITHUB_ENV
          fi
      # ★ 2026-07-30: GITHUB_TOKEN으로 push한 커밋은 다른 워크플로(deploy)를 트리거하지 않음(무한루프 방지 정책).
      #   그래서 캘린더 cron 커밋이 라이브에 반영되지 않고 7/27에 멈춰 있었음 → 이 잡에서 직접 배포한다.
      - name: Deploy to Cloudflare Pages (캘린더 변경 시에만)
        if: env.calendar_changed == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cardpick --branch=main --commit-dirty=true --commit-message="calendar cron auto-deploy"
