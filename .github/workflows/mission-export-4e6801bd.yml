name: mission-audit-manual-index-flags-4e6801bd

on:
  push:
    branches:
      - seo/p0-safe-indexing-4e6801bd

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read public index flags
        env:
          SUPABASE_URL: https://aqxrmdratnkffvivguqs.supabase.co
          SUPABASE_KEY: sb_publishable_AeDBjfn3ymozGyw06ohMUw_S6n1-qpj
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_SHA.txt
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter
          from pathlib import Path

          base=os.environ['SUPABASE_URL'].rstrip('/')
          headers={'apikey':os.environ['SUPABASE_KEY'],'Accept':'application/json'}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as res:
                  return json.loads(res.read().decode())
          rows=[]
          offset=0
          while True:
              batch=get('/rest/v1/cards?select=slug,name,name_ko,set_name,set_code,set_id,number,popularity_rank,is_indexable&game=eq.pokemon&order=popularity_rank.asc.nullslast&limit=1000&offset='+str(offset))
              rows.extend(batch)
              if len(batch)<1000: break
              offset += 1000
          true_rows=[r for r in rows if r.get('is_indexable') is True]
          report={
            'total':len(rows),
            'is_indexable_true':len(true_rows),
            'is_indexable_false_or_null':len(rows)-len(true_rows),
            'true_with_korean':sum(bool(str(r.get('name_ko') or '').strip()) for r in true_rows),
            'true_rank_bands':dict(Counter(
              'le_1000' if (r.get('popularity_rank') or 999999)<=1000 else
              'le_5000' if (r.get('popularity_rank') or 999999)<=5000 else
              'le_10000' if (r.get('popularity_rank') or 999999)<=10000 else 'other'
              for r in true_rows
            )),
            'sample':true_rows[:200],
          }
          Path('MANUAL_INDEX_FLAGS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='sample'},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cardpick-manual-index-flags-4e6801bd
          path: |
            MANUAL_INDEX_FLAGS.json
            SOURCE_SHA.txt
          retention-days: 1
